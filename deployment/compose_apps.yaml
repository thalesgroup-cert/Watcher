services:

  certstream:
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    restart: always
    volumes:
      - ${ROOT_PATH}/certstream-config.yaml:/app/config.yaml:ro
    environment:
      TZ: "${TZ}"
      HTTP_PROXY: "${HTTP_PROXY}"
      HTTPS_PROXY: "${HTTPS_PROXY}"
    networks:
      - watcher_network
  
  watcher:
    init: true
    ports:
      - "127.0.0.1:${WATCHER_PORT}:9002"
    restart: always
    command: bash -c 'update-ca-certificates && exec gunicorn watcher.wsgi:application'
    env_file:
      - ${WATCHER_PATH}/.env
      - ./.env
    tty: true
    volumes:
      - "${CA_PATH}/rootcafile.pem:/usr/local/share/ca-certificates/custom-ca.crt:ro"
    environment:
      http_proxy: "${HTTP_PROXY}"
      https_proxy: "${HTTPS_PROXY}"
      no_proxy: "${NO_PROXY},searxng,db_watcher,certstream,screenshotter"
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SCREENSHOT_SERVICE_URL: "${SCREENSHOT_SERVICE_URL-http://screenshotter:8080}"
    networks:
      - watcher_network
      - screenshots

  # Takes the screenshots of the monitored pages, data leaks and domains. The browser runs the code of the pages it visits:
  # it has its own network, shared with `watcher` only (no database, no other service), a read-only filesystem, no
  # capability, no privilege escalation and limited memory. Set SCREENSHOT_SERVICE_URL to "" on `watcher` to switch it off.
  screenshotter:
    build:
      context: ${ROOT_PATH}screenshotter
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    environment:
      TZ: "${TZ}"
      # To leave from another address, e.g. a dedicated proxy: SCREENSHOT_PROXY=http://proxy.example:3128
      SCREENSHOT_PROXY: "${SCREENSHOT_PROXY:-}"
      SCREENSHOT_USER_AGENT: "${SCREENSHOT_USER_AGENT:-}"
      SCREENSHOT_MAX_HEIGHT: "${SCREENSHOT_MAX_HEIGHT:-6000}"
      SCREENSHOT_LOAD_TIMEOUT: "${SCREENSHOT_LOAD_TIMEOUT:-30}"
    networks:
      - screenshots

  searxng:
    init: true
    hostname: searxng
    restart: unless-stopped
    command: ${SEARX_COMMAND:-}
    environment:
      TZ: "${TZ}"
      BIND_ADDRESS: "searxng:8080"
      BASE_URL: "http://${SEARX_HOSTNAME}/"
      HTTP_PROXY: "${HTTP_PROXY}"
      HTTPS_PROXY: "${HTTPS_PROXY}"
      NO_PROXY: "${NO_PROXY},watcher"
    volumes:
      - "${SEARX_PATH}:/etc/searxng:rw"
    networks:
      - watcher_network

networks:
  watcher_network:
    external: true
    name: ${NETWORK_NAME}
  # Watcher and the screenshot service only
  screenshots: {}
