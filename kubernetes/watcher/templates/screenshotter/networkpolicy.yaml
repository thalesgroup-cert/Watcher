{{- if and .Values.screenshotter.enabled .Values.screenshotter.networkPolicy.enabled }}
# Who may talk to the browser, and what the browser may reach. It needs a network plugin that applies network policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "watcher.screenshotterHost" . }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: screenshotter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: screenshotter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only Watcher asks it for a screenshot
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: watcher
      ports:
        - port: {{ .Values.screenshotter.service.port }}
          protocol: TCP
  egress:
    # Name resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The pages themselves: the internet, never the network of the cluster or of the company
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.screenshotter.networkPolicy.privateRanges }}
              - {{ . }}
              {{- end }}
{{- end }}
