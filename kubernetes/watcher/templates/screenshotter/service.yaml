{{- if .Values.screenshotter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "watcher.screenshotterHost" . }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: screenshotter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: screenshotter
  ports:
    - name: http
      port: {{ .Values.screenshotter.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
