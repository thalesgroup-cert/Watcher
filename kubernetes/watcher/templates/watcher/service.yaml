apiVersion: v1
kind: Service
metadata:
  name: {{ include "watcher.fullname" . }}
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: watcher
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: watcher
  ports:
    - name: http
      port: {{ .Values.watcher.service.port }}
      targetPort: http
      protocol: TCP
