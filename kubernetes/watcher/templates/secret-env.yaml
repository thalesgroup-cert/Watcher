{{/*
Resolve or generate a stable DJANGO_SECRET_KEY:
  1. Use .Values.django.secretKey if provided.
  2. Re-use the value already stored in the Secret (upgrade idempotency).
  3. Generate a random 50-char key on first install.
Same logic for CONNECTORS_ENCRYPTION_KEY (Fernet base64 key).
*/}}
{{- $secretKeyValue := .Values.django.secretKey -}}
{{- $encKeyValue    := .Values.django.connectorsEncryptionKey -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-env" (include "watcher.fullname" .)) -}}
{{- if not $secretKeyValue -}}
  {{- if $existing -}}
    {{- $secretKeyValue = index $existing.data "DJANGO_SECRET_KEY" | b64dec -}}
  {{- else -}}
    {{- $secretKeyValue = randAlphaNum 50 -}}
  {{- end -}}
{{- end -}}
{{- if not $encKeyValue -}}
  {{- if $existing -}}
    {{- $encKeyValue = index $existing.data "CONNECTORS_ENCRYPTION_KEY" | b64dec -}}
  {{- else -}}
    {{- /* INSECURE default — MUST be replaced with a real Fernet key in production.
         Generate one with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
         or: openssl rand -base64 32 */}}
    {{- $encKeyValue = "mGcn94AWsOHh8i4s0yHshr4wcoPnmAnsqZXZPcrRbtY=" -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "watcher.fullname" . }}-env
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: watcher
type: Opaque
stringData:
  # ── Django core ────────────────────────────────────────────────────────────
  DJANGO_SECRET_KEY: {{ $secretKeyValue | quote }}
  CONNECTORS_ENCRYPTION_KEY: {{ $encKeyValue | quote }}
  DJANGO_DEBUG: {{ .Values.django.debug | quote }}
  ALLOWED_HOSTS: {{ .Values.django.allowedHosts | quote }}
  CSRF_TRUSTED_ORIGINS: {{ .Values.django.csrfTrustedOrigins | quote }}
  TZ: {{ .Values.tz | quote }}
  TRACE_LEVEL: {{ .Values.traceLevel | quote }}

  # ── Database ───────────────────────────────────────────────────────────────
  DB_HOST: {{ include "watcher.mysqlHost" . | quote }}
  DB_NAME: {{ .Values.mysql.auth.database | quote }}
  DB_USER: {{ .Values.mysql.auth.username | quote }}
  DB_PASSWORD: {{ .Values.mysql.auth.password | quote }}

  # ── Internal services ──────────────────────────────────────────────────────
  DATA_LEAK_SEARX_URL: {{ printf "http://%s:%d/" (include "watcher.searxngHost" .) (.Values.searxng.service.port | int) | quote }}
  CERT_STREAM_URL: {{ printf "ws://%s:%d/" (include "watcher.certstreamHost" .) (.Values.certstream.service.port | int) | quote }}

  # ── Auth ───────────────────────────────────────────────────────────────────
  LOGIN_MODE: {{ .Values.auth.loginMode | quote }}
  AUTH_LDAP_SERVER_URI: {{ .Values.auth.ldap.serverUri | quote }}
  AUTH_LDAP_BIND_DN: {{ .Values.auth.ldap.bindDn | quote }}
  AUTH_LDAP_BIND_PASSWORD: {{ .Values.auth.ldap.bindPassword | quote }}
  AUTH_LDAP_BASE_DN: {{ .Values.auth.ldap.baseDn | quote }}
  AUTH_LDAP_FILTER: {{ .Values.auth.ldap.filter | quote }}
  AUTH_LDAP_VERIFY_SSL: {{ .Values.auth.ldap.verifySsl | quote }}
  OIDC_COMPANY_NAME: {{ .Values.auth.oidc.companyName | quote }}
  OIDC_RP_CLIENT_ID: {{ .Values.auth.oidc.clientId | quote }}
  OIDC_RP_CLIENT_SECRET: {{ .Values.auth.oidc.clientSecret | quote }}
  OIDC_OP_AUTHORIZATION_ENDPOINT: {{ .Values.auth.oidc.authorizationEndpoint | quote }}
  OIDC_OP_TOKEN_ENDPOINT: {{ .Values.auth.oidc.tokenEndpoint | quote }}
  OIDC_OP_USER_ENDPOINT: {{ .Values.auth.oidc.userEndpoint | quote }}
  OIDC_OP_JWKS_ENDPOINT: {{ .Values.auth.oidc.jwksEndpoint | quote }}
  OIDC_OP_ISSUER: {{ .Values.auth.oidc.issuer | quote }}
  OIDC_CREATE_USER: {{ .Values.auth.oidc.createUser | quote }}

  # ── Email ──────────────────────────────────────────────────────────────────
  SMTP_SERVER: {{ .Values.smtp.server | quote }}
  EMAIL_PORT: {{ .Values.smtp.port | toString | quote }}
  EMAIL_USE_TLS: {{ .Values.smtp.useTLS | quote }}
  EMAIL_USE_SSL: {{ .Values.smtp.useSSL | quote }}
  EMAIL_HOST_USER: {{ .Values.smtp.user | quote }}
  EMAIL_HOST_PASSWORD: {{ .Values.smtp.password | quote }}
  EMAIL_FROM: {{ .Values.smtp.from | quote }}
  SUBJECT_TAG_SITE_MONITORING: {{ .Values.smtp.subjectTagSiteMonitoring | quote }}
  EMAIL_CLASSIFICATION: {{ .Values.smtp.emailClassification | quote }}

  # ── UI / branding ──────────────────────────────────────────────────────────
  WATCHER_URL: {{ .Values.ui.watcherUrl | quote }}
  WATCHER_LOGO: {{ .Values.ui.watcherLogo | quote }}
  GITHUB_LOGO: {{ .Values.ui.githubLogo | quote }}
  WATCHER_HELP_BUTTON_LABEL: {{ .Values.ui.helpButtonLabel | quote }}
  WATCHER_HELP_BUTTON_URL: {{ .Values.ui.helpButtonUrl | quote }}

  # ── Proxy ──────────────────────────────────────────────────────────────────
  HTTP_PROXY: {{ .Values.proxy.httpProxy | quote }}
  HTTPS_PROXY: {{ .Values.proxy.httpsProxy | quote }}
  NO_PROXY: {{ .Values.proxy.noProxy | quote }}

  # ── Connectors ─────────────────────────────────────────────────────────────
  THE_HIVE_URL: {{ .Values.thehive.url | quote }}
  THE_HIVE_VERIFY_SSL: {{ .Values.thehive.verifySsl | quote }}
  THE_HIVE_KEY: {{ .Values.thehive.key | quote }}
  THE_HIVE_CUSTOM_FIELD: {{ .Values.thehive.customField | quote }}
  THE_HIVE_EMAIL_SENDER: {{ .Values.thehive.emailSender | quote }}
  THE_HIVE_TAGS: {{ .Values.thehive.tags | quote }}
  MISP_URL: {{ .Values.misp.url | quote }}
  MISP_VERIFY_SSL: {{ .Values.misp.verifySsl | quote }}
  MISP_KEY: {{ .Values.misp.key | quote }}
  MISP_TICKETING_URL: {{ .Values.misp.ticketingUrl | quote }}
  MISP_TAGS: {{ .Values.misp.tags | quote }}
  SLACK_API_TOKEN: {{ .Values.slack.apiToken | quote }}
  SLACK_CHANNEL: {{ .Values.slack.channel | quote }}
  CITADEL_API_TOKEN: {{ .Values.citadel.apiToken | quote }}
  CITADEL_ROOM_ID: {{ .Values.citadel.roomId | quote }}
  CITADEL_URL: {{ .Values.citadel.url | quote }}

  # ── Threat intelligence feeds ──────────────────────────────────────────────
  {{- with .Values.cyberWatch.cveApiUrl }}
  CYBER_WATCH_CVE_API_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.cyberWatch.ransomwareGroupsUrl }}
  CYBER_WATCH_RANSOMWARE_GROUPS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.cyberWatch.ransomwareVictimsUrl }}
  CYBER_WATCH_RANSOMWARE_VICTIMS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.cyberWatch.ransomlookGroupsUrl }}
  CYBER_WATCH_RANSOMLOOK_GROUPS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.cyberWatch.ransomlookRecentUrl }}
  CYBER_WATCH_RANSOMLOOK_RECENT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.cyberWatch.ransomlookActorsUrl }}
  CYBER_WATCH_RANSOMLOOK_ACTORS_URL: {{ . | quote }}
  {{- end }}

  # ── Weekly summary ─────────────────────────────────────────────────────────
  WEEKLY_SUMMARY_DAY: {{ .Values.weeklyNews.summaryDay | quote }}
  WEEKLY_SUMMARY_HOUR: {{ .Values.weeklyNews.summaryHour | quote }}
  BREAKING_NEWS_THRESHOLD: {{ .Values.weeklyNews.breakingNewsThreshold | toString | quote }}

  {{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
