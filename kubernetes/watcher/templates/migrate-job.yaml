apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "watcher.fullname" . }}-migrate
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.watcher.image.repository }}:{{ .Values.watcher.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.watcher.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: {{ include "watcher.fullname" . }}-env
          {{- if or .Values.tlsBundle.certfile .Values.tlsBundle.keyfile }}
          volumeMounts:
            - name: tls-bundle
              mountPath: /etc/private
              readOnly: true
          {{- end }}
      {{- if or .Values.tlsBundle.certfile .Values.tlsBundle.keyfile }}
      volumes:
        - name: tls-bundle
          secret:
            secretName: {{ include "watcher.fullname" . }}-tls-bundle
      {{- end }}
