name: Bug report
description: Something does not work as expected
title: "[Bug]: "
labels: ["bug"]
assignees:
  - ygalnezri
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search the [existing issues](https://github.com/thalesgroup-cert/Watcher/issues?q=is%3Aissue) first.

        **A security vulnerability?** Do not open a public issue: use [GitHub Security Advisories](https://github.com/thalesgroup-cert/Watcher/security/advisories/new).

  - type: input
    id: version
    attributes:
      label: Watcher version
      description: The release or the tag of the image you run.
      placeholder: "4.0.0"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Where does it happen?
      options:
        - Overview
        - Threats Watcher (trends, keywords, RSS sources)
        - AI summaries (weekly report, breaking news, LLM gateway)
        - Cyber Watch (CVEs, ransomware, watch rules)
        - Data Leak
        - DNS Threats
        - Website Monitoring
        - Legitimate Domains
        - Connectors and notifications
        - Authentication (local, LDAP, SSO)
        - API
        - Django admin
        - Installation, Docker or update
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How do you run Watcher?
      options:
        - Docker Compose (docker-compose.yml at the root)
        - Docker Compose (deployment/ folder)
        - Kubernetes / Helm
        - From the sources (manage.py runserver)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "From `docker compose logs watcher` or `logs/<module>.log`. Remove tokens, passwords and API keys first."
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag an image here if it helps.

  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: "Firefox 140 on Windows 11"

  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the existing issues.
          required: true
        - label: There is no secret (token, password, API key) in what I pasted.
          required: true
